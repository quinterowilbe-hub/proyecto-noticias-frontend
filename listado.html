<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notiportal - Listado de Noticias</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Notiportal</div>
    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a href="listado.html">Noticia</a>
      <a href="detalle.html">Detalle</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <!-- TÍTULO -->
  <section class="titulo-seccion">
    <h1>EXPLORA NUESTRAS NOTICIAS</h1>
  </section>

  <!-- FILTROS -->
  <section class="filtros">
    <button class="filtro activo" data-categoria="todas">Todas</button>
    <button class="filtro" data-categoria="Educativas">Educativas</button>
    <button class="filtro" data-categoria="Tecnológicas">Tecnológicas</button>
    <button class="filtro" data-categoria="Turísticas">Turísticas</button>
    <button class="filtro" data-categoria="Comerciales">Comerciales</button>
  </section>

  <!-- GRID DE NOTICIAS -->
  <section class="noticias">
    <div class="grid-cards" id="contenedor-listado">
      <!-- Las cards se cargan dinámicamente desde JSON -->
    </div>
  </section>
  
  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-contenido">
      <div>
        <h3>Notiportal</h3>
        <p>Las noticias que necesitas, en un solo lugar.</p>
      </div>
      <div>
        <p>correo@noticias.com | Tel: 123 456 789</p>
      </div>
      <div>
        <p>Facebook | X | Instagram</p>
      </div>
    </div>
    <p class="copyright">© 2026 Notiportal. Todos los derechos reservados.</p>
  </footer>

  <script src="js/app.js"></script>
<script src="js/favoritos.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const noticias = await cargarNoticias();
    renderizarCards(noticias, 'contenedor-listado');

    // Filtros
    const botonesFiltro = document.querySelectorAll('.filtro');
    botonesFiltro.forEach(boton => {
      boton.addEventListener('click', () => {
        botonesFiltro.forEach(b => b.classList.remove('activo'));
        boton.classList.add('activo');

        const categoria = boton.dataset.categoria;
        const filtradas = categoria === 'todas'
          ? noticias
          : noticias.filter(n => n.categoria === categoria);

        renderizarCards(filtradas, 'contenedor-listado');
      });
    });
  });
</script>
</body>
</html>

</body>
</html>
